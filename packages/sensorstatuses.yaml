template:
    - trigger: 
        - trigger: time_pattern
          seconds: "/30"
      sensor:
        - name: "Solar Status"
          unique_id: solar_status_sensor
          state: >
           {% set gen = states('sensor.solar_gen') | float(0) %}
           {% set threshold = states('input_number.solar_threshold') | float(0) %}
           {% if gen == 0 %}
             Zero_solar  
           {% elif gen >= threshold %}
             Good
           {% else %}
             Bad
           {% endif %}
        - name: "Hydro Status"
          unique_id: hydro_status_sensor
          state: >
           {% set gen = states('sensor.hydro_gen') | float(0) %}
           {% set threshold = states('input_number.hydro_threshold') | float(0) %}
           {# previously tested for zero and then output Zero_hydro, but #}
           {# removed for easier testing of thresholds.                  #}
           {% if gen >= threshold %}
             Good
           {% else %}
             Bad
           {% endif %}
        - name: "Wind Status"
          unique_id: wind_status_sensor
          state: >
           {% set gen = states(    'sensor.wind_gen') | float(0) %}
           {% set threshold = states('input_number.wind_threshold') | float(0) %}

           {% if gen == 0 %}
             Zero_wind
           {% elif gen >= threshold %}
             Good
           {% else %}
             Bad
           {% endif %}
        - name: "Overall Renewables Status"
          unique_id: sensor.overall_renewable_status
          state: >
            {% set count = [states('sensor.solar_status'), states('sensor.hydro_status'), 
                            states('sensor.wind_status')] | select ('equalto', 'Good') | list | length %}
            {{ ['Below_Minimum', 'Low_Availability', 'Medium_Availability', 'High_Availability'][count] }}
            