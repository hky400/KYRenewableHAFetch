automation: 
 - alias: GlobeLight Change
   trigger:
     platform: state
     entity_id: sensor.overall_status
   condition: []
   action:
     - choose:
         - conditions:
             - condition: template
               value_template: "{{ states('sensor.overall_status') == 'Good' }}"
           sequence: 
             - service: light.turn_on
               target:
                 entity_id: light.night_light_2
               data:
                 rgb_color: [0, 255, 0]
         - conditions:
             - condition: template
               value_template: "{{ states('sensor.overall_status') == 'Fine' }}"
           sequence: 
             - service: light.turn_on
               target:
                 entity_id: light.night_light_2
               data:
                 rgb_color: [255, 255, 0]
         - conditions:
             - condition: template
               value_template: "{{ states('sensor.overall_status') == 'Okay' }}"
           sequence: 
             - service: light.turn_on
               target:
                 entity_id: light.night_light_2
               data:
                 rgb_color: [255, 165, 0]
         - conditions:
             - condition: template
               value_template: "{{ states('sensor.overall_status') == 'Bad' }}"
           sequence: 
             - service: light.turn_on
               target:
                 entity_id: light.night_light_2
               data:
                 rgb_color: [255, 0, 0]
