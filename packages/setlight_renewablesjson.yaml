automation:
  - id: "setlightrenewablesjsonupdate"
    #friendly_name: "SetLightColorRenewablesJSONupdate"
    alias: 'SetLightColorbyRenewablesJSONUpdate'
    description: 'This sets the color of the light based on JSON renewables data'
    triggers:
      - seconds: /5
        trigger: time_pattern
    conditions: []
    actions:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.wiz_rgbw_tunable_752ff2
        data:
          brightness_pct: >-
              {% if (states('sensor.solar_gen') | float) > 0 %}
              100 
              {% elif (states('sensor.wind_gen') | float) > 0 %}
              100 
              {% elif  (states('sensor.hydro_gen') | float) > 0 %}
              100
              {% else %} 
              0
              {% endif %}  
          rgb_color:
            - '{{ (states(''sensor.solar_gen'') | float(0)/100 *255) }}'
            - '{{ (states(''sensor.wind_gen'') | float(0)/100 *255) }}'
            - '{{ (states(''sensor.hydro_gen'') | float(0)/100 *255) }}' 
    mode: single
    