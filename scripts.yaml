make_light_solar:
  alias: Make Light Solar
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.globe_nightlight
      data:
        rgb_color: [255, 165, 0]
        brightness: >
          {% set pct = states('sensor.solar_generation') | float(0) %}
          {{ (pct * 2.55) | round(0) }}
  mode: single

